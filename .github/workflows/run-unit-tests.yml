name: Unit Tests Run
on:
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Fork PRs cannot rely on the base repository's configuration variables.
    # These credentials belong only to this job's disposable MongoDB service.
    env:
      ENVIRONMENT: development
      DATABASE_TECHNOLOGY: mongoDB
      MONGO_PROTOCOL: mongodb
      MONGO_HOST: 127.0.0.1
      MONGO_PORT: '27018'
      DATABASE_NAME: sphere_scratch
      DATABASE_USERNAME: sphere_ci
      DATABASE_PASSWORD: sphere-ci-test-only
      SERVER_PORT: '3000'
      SERVER_STATICS_FOLDER: public/
      AVATARS_FOLDER: static/avatars/users
      ORG_AVATARS_FOLDER: static/avatars/orgs
      COLLECTIONS_FOLDER: static/collections
      REDIS_URL: redis://127.0.0.1:6378
    services:
      mongodb:
        image: mongo:7.0.16
        ports:
          - 27018:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: sphere-ci-root-test-only
          MONGO_INITDB_DATABASE: sphere_scratch
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4.2
        ports:
          - 6378:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Initialize MongoDB user
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec \
            -e DATABASE_NAME -e DATABASE_USERNAME -e DATABASE_PASSWORD \
            "${{ job.services.mongodb.id }}" \
            mongosh 'mongodb://root:sphere-ci-root-test-only@127.0.0.1:27017/admin' --quiet --eval '
              const database = db.getSiblingDB(process.env.DATABASE_NAME);
              database.createUser({
                user: process.env.DATABASE_USERNAME,
                pwd: process.env.DATABASE_PASSWORD,
                roles: [
                  { role: "readWrite", db: process.env.DATABASE_NAME },
                  { role: "dbAdmin", db: process.env.DATABASE_NAME }
                ]
              });
            '

      - name: Install MiniZinc
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y minizinc

      - name: Verify MiniZinc and Gecode
        shell: bash
        run: |
          set -Eeuo pipefail
          minizinc --version
          minizinc --solvers | tee /tmp/sphere-ci-solvers.txt
          grep -qi gecode /tmp/sphere-ci-solvers.txt

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

      - name: Run frontend tests when provided
        run: pnpm --dir frontend run --if-present test
