                example: 15

    Pricing:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
          description: URL-friendly identifier auto-generated from the pricing name
          example: "zoom"
        owner:
          type: string
        collection:
          type: object
          description: Details about the collection that contains the pricing, if any
          properties:
            id:
              type: string
              description: ID of the collection
            name:
              type: string
              description: Name of the collection
            slug:
              type: string
              description: Slug of the collection
          example:
            id: "68050bd09890322c57842f6f"
            name: "My Collection"
            slug: "my-collection"
        version:
          type: string
          description: Any string representing the version of the pricing definition (e.g. "1.0", "2.1.3", "2024-09-30")
