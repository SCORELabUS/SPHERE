tags:
  - name: Healthcheck
    description: Service health verification (Public)
  - name: Authentication
    description: User authentication and API key management
  - name: Users
    description: User account management
  - name: Organizations
    description: |
      Organization, invitations and membership management
  - name: Pricings
    description: Pricing Version Control System (PVCS)
  - name: Collections
    description: Collection management for grouping pricings
  - name: User Access
    description: Retrieve pricings and collections a user can access
  - name: Permissions
    description: Retrieve permission information for entities
  - name: Notifications
    description: User notifications and real-time updates
  - name: Cache
    description: Redis cache operations for temporary data storage

paths:
  /healthcheck:
    get:
      summary: Service health check
      description: |
        Verifies that the SPACE API service is operational and responsive. 
        Use this endpoint for load balancer health checks.

        **Authentication**: Public (no API key required)

      tags:
        - Healthcheck
      responses:
        '200':
          description: Service is operational
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Service is up and running!

  /users/login:
    post:
      summary: Authenticate user and obtain API Key
      description: |
        Authenticates a user with username/email and password and returns a User token 
        that can be used for subsequent authenticated requests.

        **Authentication**: Public
        
        **Returns**: User's token

      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: User credentials
              properties:
                loginField:
                  $ref: '#/components/schemas/LoginField'
                password:
                  $ref: '#/components/schemas/Password'
              required:
                - loginField
                - password
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    $ref: '#/components/schemas/ApiToken'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid credentials

  /users/register:
    post:
      summary: Register a new user
      description: |
        Registers a new local user account and sends a single-use email verification link.
        The account cannot sign in until the email address is verified.

        **Authentication**: Public

      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/requestBodies/UserRegister'
      responses:
        '201':
          description: User registered; email verification is required
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  emailVerificationRequired:
                    type: boolean
                    enum: [true]
                  emailSent:
                    type: boolean
                    description: Whether the first delivery attempt was accepted by the email provider
                  message:
                    type: string
                    description: JWT authentication token
        '409':
          description: An account already exists with the supplied email. The user must authenticate with its existing method before adding a local password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/email-verification/verify:
    post:
      summary: Verify a registered email address
      description: Consumes a single-use verification token. Tokens expire after 24 hours.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  maxLength: 256
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '422':
          description: The token is invalid, expired, or has already been used
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/email-verification/resend:
    post:
      summary: Request another verification email
      description: Always returns the same response to prevent account enumeration. Delivery is limited to one request per account per minute.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginField]
              properties:
                loginField:
                  type: string
                  description: Email address or username
      responses:
        '202':
          description: The request was accepted whether or not a matching pending account exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /users:
    get:
      summary: Get all users or search users
      description: |
        Retrieves a paginated list of users. Supports two access modes:

        **1. ADMIN mode (no `q` parameter):**
        Returns all users with full details. Only accessible to ADMIN users.

        **2. Search mode (`q` parameter with 4+ characters):**
        Searches users by username, firstName, or lastName (case-insensitive partial match).
        Accessible to any authenticated user (ADMIN or USER).
        When using search mode, sensitive fields (email, role, phone, token, apiKeys) are excluded from the response.

        **Authentication**: User token

        **Permission**:
        - ADMIN: full access to all users (with or without `q`)
        - USER: only accessible with `q` parameter (4+ characters)
      
      tags:
        - Users
      security:
        - ApiKeyAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 4
          description: |
            Search query to find users by username, firstName, or lastName.
            Must be at least 4 characters long. When provided, any authenticated user can access this endpoint.
            Sensitive fields are excluded from the response for non-ADMIN users.
        - $ref: '#/components/parameters/UsernameQuery'
        - $ref: '#/components/parameters/Email'
        - $ref: '#/components/parameters/Role'
        - $ref: '#/components/parameters/SortByUsers'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Operation Completed
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/User'
                    description: Full user list (ADMIN only, no q parameter)
                  - type: array
                    items:
                      $ref: '#/components/schemas/PublicUser'
                    description: Search results (with q parameter, sensitive fields excluded)
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions (USER without q parameter, or q < 4 chars)
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me:
    get:
      summary: Get current user details
      description: |
        Retrieves detailed information about the currently authenticated user.

        **Authentication**: User token

      tags:
        - Users
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Operation Completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Authentication required
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/orgs:
    get:
      summary: Get current user's organizations
      description: |
        Retrieves organizations the currently authenticated user is a member of.
        Returns a tree-structured list where each top-level organization includes its
        sub-organizations nested under the `subOrganizations` field. Each item also
        includes the user's `role` in that organization.

        Supports optional pagination via `limit` and `offset` query parameters.
        When pagination params are provided, the response is wrapped in an object
        with `items` and `total` fields. When omitted, returns a flat array for
        backward compatibility.

        **Authentication**: User token

        **Permission**: Any authenticated user (ADMIN or USER) can access this endpoint.

      tags:
        - Users
      security:
        - ApiKeyAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Maximum number of top-level organizations to return
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of top-level organizations to skip
      responses:
        '200':
          description: List of organizations the user belongs to (tree-structured)
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/UserOrganization'
                    description: Plain array when no pagination params are provided
                  - $ref: '#/components/schemas/PaginatedUserOrganizations'
        '401':
          description: Authentication required — no valid token or API key provided
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/identities:
    get:
      summary: List current user's sign-in methods
      description: Returns connected external identities and whether the account has a local password. Requires a user JWT; API keys cannot manage identities.
      tags:
        - Users
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Sign-in methods retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationMethods'
        '401':
          description: A user session is required
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/identities/{provider}/initiate:
    post:
      summary: Start connecting an external identity
      description: Creates a single-use connection transaction bound to the authenticated SPHERE user and returns the provider authorization URL.
      tags:
        - Users
      security:
        - ApiKeyAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, us]
      responses:
        '200':
          description: Connection transaction created
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    format: uri
        '401':
          description: A user session is required
        '404':
          description: Unknown identity provider
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/identities/{provider}:
    delete:
      summary: Disconnect an external identity
      description: Disconnects a provider only when another sign-in method remains available.
      tags:
        - Users
      security:
        - ApiKeyAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, us]
      responses:
        '200':
          description: Identity disconnected successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationMethods'
        '401':
          description: A user session is required
        '403':
          description: The identity is the account's last sign-in method
        '404':
          description: Provider or connected identity not found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/password:
    post:
      summary: Create a local password
      description: Adds local username/email and password access to an account that currently has no password. Existing passwords cannot be replaced through this endpoint.
      tags:
        - Users
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 128
      responses:
        '200':
          description: Local password created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationMethods'
        '401':
          description: A user session is required
        '409':
          description: The account already has a local password
        '422':
          description: Password validation failed
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/settings:
    get:
      summary: Get current user's settings
      description: |
        Retrieves the full settings for the currently authenticated user, including
        profile, social links, notification preferences, and avatar configuration.
        Sensitive fields (password, token, API keys) are excluded.

        **Authentication**: User token

        **Permission**: Any authenticated user (ADMIN or USER).

      tags:
        - Users
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: User settings retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '401':
          description: Authentication required
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update current user's account settings
      description: |
        Updates the account-level settings for the currently authenticated user.
        Only provided fields are updated (partial update).

        **Authentication**: User token

        **Permission**: Any authenticated user (ADMIN or USER).

      tags:
        - Users
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                firstName:
                  type: string
                lastName:
                  type: string
                phone:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Settings updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '401':
          description: Authentication required
        '422':
          description: Validation error (e.g. email already in use)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/settings/profile:
    put:
      summary: Update current user's public profile
      description: |
        Updates the public profile fields for the currently authenticated user.
        These fields control how the user appears to other users on the platform.

        **Authentication**: User token

        **Permission**: Any authenticated user (ADMIN or USER).

      tags:
        - Users
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  nullable: true
                  description: Public display name (overrides real name in rankings)
                bio:
                  type: string
                  nullable: true
                  maxLength: 200
                city:
                  type: string
                  nullable: true
                country:
                  type: string
                  nullable: true
                dateOfBirth:
                  type: string
                  format: date
                  nullable: true
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '401':
          description: Authentication required
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/settings/social-links:
    put:
      summary: Update current user's social links
      description: |
        Updates the social media links for the currently authenticated user.
        URLs are validated against platform-specific patterns.

        **Authentication**: User token

        **Permission**: Any authenticated user (ADMIN or USER).

      tags:
        - Users
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                linkedin:
                  type: string
                  format: uri
                  nullable: true
                instagram:
                  type: string
                  format: uri
                  nullable: true
                facebook:
                  type: string
                  format: uri
                  nullable: true
                x:
                  type: string
                  format: uri
                  nullable: true
      responses:
        '200':
          description: Social links updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '401':
          description: Authentication required
        '422':
          description: Invalid URL for a social platform
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/settings/notifications:
    put:
      summary: Update current user's notification preferences
      description: |
        Updates the notification preferences for the currently authenticated user.
        Controls which notification types are received via which channels.

        **Authentication**: User token

        **Permission**: Any authenticated user (ADMIN or USER).

      tags:
        - Users
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Map of notification kind to channel preferences
              additionalProperties:
                type: object
                properties:
                  email:
                    type: boolean
                  inbox:
                    type: boolean
              example:
                OrganizationInvitation: { email: true, inbox: true }
                System: { email: true, inbox: false }
                CollectionShared: { email: false, inbox: true }
                PricingUpdated: { email: false, inbox: false }
      responses:
        '200':
          description: Notification preferences updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '401':
          description: Authentication required
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/settings/avatar:
    post:
      summary: Upload avatar image
      description: |
        Uploads a new avatar image for the currently authenticated user.
        Accepts JPEG, PNG, and WebP formats. Maximum file size is 2MB.
        The image is saved to disk and the avatar path is updated.

        **Authentication**: User token

        **Permission**: Any authenticated user (ADMIN or USER).

      tags:
        - Users
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Image file (JPEG, PNG, or WebP, max 2MB)
                avatarBgColor:
                  type: string
                  description: Background color for avatar (hex)
                  example: "#fa520f"
                avatarFgColor:
                  type: string
                  description: Foreground/text color for avatar (hex)
                  example: "#ffffff"
      responses:
        '200':
          description: Avatar uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatar:
                    type: string
                    description: URL path to the uploaded avatar
        '400':
          description: No file uploaded or invalid file type/size
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Remove avatar (revert to initials)
      description: |
        Removes the current user's custom avatar, reverting to the initials-based
        default display.

        **Authentication**: User token

        **Permission**: Any authenticated user (ADMIN or USER).

      tags:
        - Users
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Avatar removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '401':
          description: Authentication required
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/settings/avatar-colors:
    put:
      summary: Update avatar colors (for initials/SVG mode)
      description: |
        Updates the avatar display with custom colors. Used for initials-based
        avatars or SVG avatars to set background and foreground colors.

        **Authentication**: User token

        **Permission**: Any authenticated user (ADMIN or USER).

      tags:
        - Users
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - avatarBgColor
                - avatarFgColor
              properties:
                avatarPath:
                  type: string
                  description: Path to the avatar file (for SVG avatars)
                avatarBgColor:
                  type: string
                  description: Background color (hex)
                  example: "#fa520f"
                avatarFgColor:
                  type: string
                  description: Foreground/text color (hex)
                  example: "#ffffff"
      responses:
        '200':
          description: Avatar colors updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '401':
          description: Authentication required
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # /users/{username}/settings:
  #   get:
  #     summary: Get user settings by username (ADMIN only)
  #     description: |
  #       Retrieves the full settings for a specific user by username.
