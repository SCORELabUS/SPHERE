        # ------------------------------
    # --      ORGANIZATIONS       --
    # ------------------------------

    Organization:
      type: object
      description: |
        Represents an organization in the SPHERE platform. Organizations group users
        together and can own pricings and collections. Each user is automatically assigned
        a personal organization upon registration. Organizations support hierarchical
        parent-child relationships via the `_parentId` and `ancestors` fields.
      required:
        - id
        - name
        - displayName
        - isPersonal
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Unique MongoDB ObjectId identifier of the organization
          example: "68050bd09890322c57842f6f"
        name:
          type: string
          description: |
            URL-safe unique identifier for the organization. Must be 3-50 characters,
            lowercase letters, digits, hyphens, and underscores only. Cannot be changed
            after creation. For personal organizations, this is set to the owner's username.
          example: "acme-corp"
          minLength: 3
          maxLength: 50
          pattern: '^[a-z0-9_-]+$'
        displayName:
          type: string
          description: Human-readable name for the organization (max 255 characters)
          example: "Acme Corporation"
          maxLength: 255
        description:
          type: string
          nullable: true
          description: Optional free-text description of the organization
          example: "The leading provider of SaaS solutions"
        avatar:
          type: string
          nullable: true
          description: URL to the organization's avatar image
          example: "https://sphere.score.us.es/static/avatars/orgs/org-avatar.png"
        _parentId:
          type: string
          nullable: true
          description: |
            ID of the parent organization, or `null` if this is a top-level organization.
            When set, this organization is a child in the hierarchy. Users with membership
            in ancestor organizations automatically inherit role-based access.
          example: "68050bd09890322c57842f6f"
        ancestors:
          type: array
          description: |
            Materialized path of ancestor organization IDs from root to immediate parent.
            Empty array for top-level organizations. Used for efficient hierarchy queries
            and role inheritance resolution.
          items:
            type: string
          example: ["68050bd09890322c57842f6f"]
        subOrganizations:
          type: array
          description: |
            List of immediate child organizations. Not stored in the database, but included
            in API responses for convenience when fetching organization details.
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              displayName:
                type: string
              description:
                type: string
                nullable: true
              _parentId:
                type: string
                nullable: true
              ancestors:
                type: array
                items:
                  type: string
              avatar:
                type: string
                nullable: true
        isPersonal:
          type: boolean
          description: |
            Whether this is a personal organization. Personal organizations are
            automatically created for each user and cannot be deleted.
          default: false
          example: false
        createdAt:
          $ref: '#/components/schemas/Date'
        updatedAt:
          $ref: '#/components/schemas/Date'

    UserOrganization:
      type: object
      description: |
        An organization as returned by the user's organization list endpoint. Extends the
        base Organization with the user's role and nested sub-organizations.
      required:
        - id
        - name
        - displayName
        - isPersonal
        - role
      properties:
        id:
          type: string
          description: Unique MongoDB ObjectId identifier of the organization
          example: "68050bd09890322c57842f6f"
        name:
          type: string
          description: URL-safe unique identifier for the organization
          example: "acme-corp"
        displayName:
          type: string
          description: Human-readable name for the organization
          example: "Acme Corporation"
        description:
          type: string
          nullable: true
          description: Optional free-text description of the organization
        avatar:
          type: string
          nullable: true
          description: URL to the organization's avatar image
        avatarBgColor:
          type: string
          description: Background color for avatar initials fallback
        avatarFgColor:
          type: string
          description: Foreground color for avatar initials fallback
        _parentId:
          type: string
          nullable: true
          description: ID of the parent organization, or null if top-level
        ancestors:
          type: array
          description: Materialized path of ancestor organization IDs
          items:
            type: string
        isPersonal:
          type: boolean
          description: Whether this is a personal organization
        role:
          type: string
          enum: [OWNER, ADMIN, MEMBER]
          description: The authenticated user's role in this organization
          example: "MEMBER"
        subOrganizations:
          type: array
          description: Nested child organizations (tree structure)
          items:
            $ref: '#/components/schemas/UserOrganization'

    PaginatedUserOrganizations:
      type: object
      description: Paginated response containing user organizations with tree structure
      required:
        - items
        - total
      properties:
        items:
          type: array
          description: Array of top-level organizations with nested sub-organizations
          items:
            $ref: '#/components/schemas/UserOrganization'
        total:
          type: integer
          description: Total number of top-level organizations the user belongs to
          example: 5

    OrganizationMember:
      type: object
      description: |
        Represents a user's membership in an organization. Returned by the members listing
        endpoint with enriched user data (via aggregation pipeline join with the users collection).
      required:
        - id
        - role
        - joinedAt
      properties:
        id:
          type: string
          description: Unique MongoDB ObjectId of the membership record (not the user or organization)
          example: "68050bd09890322c57842f70"
        role:
          type: string
          enum: [OWNER, ADMIN, MEMBER]
          description: |
            The member's role within the organization:
            - **OWNER**: Full control over the organization, can manage members, invitations, and settings
            - **ADMIN**: Can manage members and invitations, but cannot delete the organization
            - **MEMBER**: Basic access, can view organization resources
          example: "ADMIN"
        joinedAt:
          $ref: '#/components/schemas/Date'
        user:
          type: object
          description: |
            Basic user information for the member. Included when listing members via the
            aggregation pipeline that joins membership records with the users collection.
          properties:
            id:
              type: string
              description: The user's MongoDB ObjectId
              example: "68050bd09890322c57842f71"
            username:
              type: string
              description: The user's unique username
              example: "johndoe"
            email:
              type: string
              format: email
              description: The user's email address
              example: "johndoe@example.com"
            avatar:
              type: string
              nullable: true
              description: URL to the user's avatar image
              example: "https://sphere.score.us.es/static/avatars/users/default-avatar.png"
            avatarBgColor:
              type: string
              description: Background color for the avatar (hex color code). Used for initials/SVG avatars.
              example: "#fa520f"
            avatarFgColor:
              type: string
              description: Foreground/text color for the avatar (hex color code). Used for initials/SVG avatars.
              example: "#ffffff"

    OrganizationInvitation:
      type: object
      description: |
        Represents an invitation to join an organization. Invitations are created by
        OWNER or ADMIN members and generate a unique code that can be shared with users.
        Users join via `POST /orgs/join/{code}` and are always assigned the `MEMBER` role.
      required:
        - id
        - code
        - useCount
        - createdAt
      properties:
        id:
          type: string
          description: Unique MongoDB ObjectId of the invitation
          example: "68050bd09890322c57842f72"
        code:
          type: string
          description: |
            Unique invitation code (10-character hex string) generated via
            `crypto.randomBytes(5).toString('hex')`. This is the code users provide
            to join the organization.
          example: "a1b2c3d4e5"
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When the invitation expires. `null` means the invitation never expires.
            Default is 7 days from creation if not specified.
          example: "2025-12-31T23:59:59Z"
        maxUses:
          type: number
          nullable: true
          description: |
            Maximum number of times this invitation can be accepted. `null` means
            unlimited uses. Once `useCount` reaches `maxUses`, the invitation can
            no longer be used.
          example: 10
        useCount:
          type: number
          description: |
            How many times this invitation has been accepted. Incremented atomically
            each time a user joins via this invitation.
          example: 3
        createdAt:
          $ref: '#/components/schemas/Date'

    OrganizationInvitationPreview:
      type: object
      description: |
        Preview of an organization invitation, returned by the `GET /orgs/invitations/preview/{code}`
        endpoint. Contains the full invitation details along with basic organization information
        so users can see which organization they'll be joining before accepting.
      properties:
        invitation:
          $ref: '#/components/schemas/OrganizationInvitation'
        organization:
          type: object
          description: |
            Basic organization information visible in the invitation preview. Includes
            enough detail for users to identify the organization before deciding to join.
          properties:
            id:
              type: string
              description: The organization's MongoDB ObjectId
              example: "68050bd09890322c57842f6f"
            name:
              type: string
              description: The organization's unique URL-safe name
              example: "acme-corp"
            displayName:
              type: string
              description: The organization's human-readable name
              example: "Acme Corporation"
            avatar:
              type: string
              nullable: true
              description: URL to the organization's avatar image
              example: "https://sphere.score.us.es/static/avatars/orgs/org-avatar.png"
            isPersonal:
              type: boolean
              description: Whether this is a personal organization

    # ------------------------------
    # --       NOTIFICATIONS      --
    # ------------------------------

    Notification:
      type: object
      description: |
        Represents a notification for a user. Notifications are created for various events
        such as organization invitations, system messages, and more.
      required:
        - id
        - kind
        - title
        - message
        - read
        - createdAt
      properties:
        id:
          type: string
          description: Unique MongoDB ObjectId of the notification
          example: "68050bd09890322c57842f80"
        kind:
          type: string
          enum: [OrganizationInvitation, System, CollectionShared, PricingUpdated]
          description: The type of notification
          example: "OrganizationInvitation"
        title:
          type: string
          description: Short title of the notification
          example: "You've been invited to join Acme Corp"
        message:
          type: string
          description: Detailed message of the notification
          example: "John Doe has invited you to join Acme Corp"
        data:
          type: object
          description: Additional data related to the notification (kind-specific)
          example: { "invitationCode": "a1b2c3d4e5", "organizationId": "68050bd09890322c57842f6f" }
        read:
          type: boolean
          description: Whether the notification has been read
          example: false
        createdAt:
          $ref: '#/components/schemas/Date'
    
    # ------------------------------
    # --   ENTITY PERMISSION SCHEMAS --
    # ------------------------------

    EntityPermission:
      type: object
      description: An entity permission record linking a user to specific permissions on a pricing or collection
      properties:
        id:
          type: string
          description: The unique identifier of the permission record
          example: "68050bd09890322c57842f80"
        _userId:
          type: string
          description: The ID of the user this permission applies to
          example: "68050bd09890322c57842f71"
        _organizationId:
          type: string
          description: The ID of the organization this permission belongs to
          example: "68050bd09890322c57842f6f"
        entityType:
          type: string
          enum: [pricing, collection]
          description: The type of entity this permission applies to
          example: "pricing"
        entitySlug:
          type: string
          nullable: true
          description: The URL-friendly slug of the entity (pricing or collection). Null for org-scoped permissions.
          example: "zoom"
        permissions:
          $ref: '#/components/schemas/EntityPermissions'
        grantedBy:
          type: string
          description: The ID of the user who granted this permission
          example: "68050bd09890322c57842f71"
        entityName:
          type: string
          description: The name of the entity (populated in responses)
          example: "My Pricing"
        userName:
          type: string
          description: The username of the user (populated in responses)
          example: "johndoe"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EntityPermissions:
      type: object
      description: Granular permissions for an entity
      properties:
        GET:
          type: boolean
          description: Whether the user can view the entity
          example: true
        PUT:
          type: boolean
          description: Whether the user can update the entity
          example: false
        DELETE:
          type: boolean
          description: Whether the user can delete the entity
          example: false
        CREATE:
          type: boolean
          description: Whether the user can create new versions or child entities
          example: false

    BulkPermissionItem:
      type: object
      required:
        - userId
        - entityType
        - permissions
      properties:
        userId:
          type: string
          pattern: '^[a-f0-9]{24}$'
          description: The MongoDB ObjectId of the user to grant permissions to
          example: "68050bd09890322c57842f71"
        entityType:
          type: string
          enum: [pricing, collection]
          description: The type of entity to set permissions for
          example: "pricing"
        entitySlug:
          type: string
          nullable: true
          description: The entity slug, or null for organization-scoped permissions
          example: "zoom"
        permissions:
          $ref: '#/components/schemas/EntityPermissions'

    BulkSetPermissionsResult:
      type: object
      required:
        - created
        - updated
        - permissions
      properties:
        created:
          type: integer
          minimum: 0
          description: Number of permission records created
          example: 2
        updated:
          type: integer
          minimum: 0
          description: Number of existing permission records updated
          example: 1
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/EntityPermission'

    UserPricingsResponse:
      type: object
      description: Response containing pricings accessible to a user with their permissions
      properties:
        pricings:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: "My Pricing"
              permissions:
                $ref: '#/components/schemas/EntityPermissions'
              organization:
                type: object
                properties:
                  id:
                    type: string
                  role:
                    type: string
                    enum: [OWNER, ADMIN, MEMBER]
        total:
          type: integer
          description: Total number of pricings accessible to the user
          example: 10

    UserCollectionsResponse:
      type: object
      description: Response containing collections accessible to a user with their permissions
      properties:
        collections:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: "My Collection"
              permissions:
                $ref: '#/components/schemas/EntityPermissions'
              organization:
                type: object
                properties:
                  id:
                    type: string
                  role:
                    type: string
                    enum: [OWNER, ADMIN, MEMBER]
        total:
          type: integer
          description: Total number of collections accessible to the user
          example: 10

    # ------------------------------
    # --          ERRORS          --
    # ------------------------------

    FieldValidationError:
      type: object
      properties:
        type:
          type: string
          example: field
        msg:
          type: string
          example: Password must be a string
        path:
          type: string
          example: password
        location:
          type: string
          example: body
        value:
          example: invalid
      required:
        - type
        - msg
        - path
        - location

  requestBodies:
    UserRegister:
      description: User registration object
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - username
              - password
              - firstName
              - lastName
              - email
              - phone
            properties:
              username:
                type: string
                minLength: 3
                maxLength: 30
                pattern: '^[a-zA-Z0-9_]+$'
                description: Unique username for the user (alphanumeric characters and underscores only)
                example: egegeg
              password:
                type: string
                minLength: 5
                description: Password for the user account (minimum length of 5 characters)
                example: egegeg
              firstName:
                type: string
                description: User's first name
                example: egeg
              lastName:
                type: string
                description: User's last name
                example: egegeg
              email:
                type: string
                format: email
                description: User's email address (must be a valid email format)
                example: egeg@egeg.eg
              phone:
                type: string
                description: User phone number in international format
                example: "+34 666666666"
              address:
                type: string
                description: User address
                example: ""
    
    UserUpdate:
      description: User information update object
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              username:
                type: string
              role:
                $ref: '#/components/schemas/Role'
              firstName:
                type: string
              lastName:
                type: string
              email:
                type: string
                format: email
              phone:
                type: string
                nullable: true
              avatar:
                type: string
                nullable: true
                description: URI to the user's avatar (processed)
              address:
                type: string
                nullable: true
              postalCode:
                type: string
                nullable: true
              token:
                type: string
                nullable: true
              tokenExpiration:
                type: string
                format: date-time
                nullable: true
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
    
    PricingUpdate:
      description: Pricing metadata update object. (All fields are optional, but at least one must be provided)
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 255
              owner:
                type: string
                minLength: 1
                maxLength: 255
              private:
                type: boolean
              _collectionId:
                type: string
                description: MongoDB ObjectId reference
              createdAt:
                type: string
                format: date-time
              url:
                type: string
                format: uri
              yaml:
                type: string
                description: Serialized pricing definition in YAML format
              analytics:
                type: object
                properties:
                  numberOfFeatures:
                    type: number
                  numberOfInformationFeatures:
                    type: number
                  numberOfIntegrationFeatures:
                    type: number
                  numberOfIntegrationApiFeatures:
                    type: number
                  numberOfIntegrationExtensionFeatures:
                    type: number
                  numberOfIntegrationIdentityProviderFeatures:
                    type: number
                  numberOfIntegrationWebSaaSFeatures:
                    type: number
                  numberOfIntegrationMarketplaceFeatures:
                    type: number
                  numberOfIntegrationExternalDeviceFeatures:
                    type: number
                  numberOfDomainFeatures:
                    type: number
                  numberOfAutomationFeatures:
                    type: number
                  numberOfBotAutomationFeatures:
                    type: number
                  numberOfFilteringAutomationFeatures:
                    type: number
                  numberOfTrackingAutomationFeatures:
                    type: number
                  numberOfTaskAutomationFeatures:
                    type: number
                  numberOfManagementFeatures:
                    type: number
                  numberOfGuaranteeFeatures:
                    type: number
                  numberOfSupportFeatures:
                    type: number
                  numberOfPaymentFeatures:
                    type: number
                  numberOfUsageLimits:
                    type: number
                  numberOfRenewableUsageLimits:
                    type: number
                  numberOfNonRenewableUsageLimits:
                    type: number
                  numberOfResponseDrivenUsageLimits:
                    type: number
                  numberOfTimeDrivenUsageLimits:
                    type: number
                  numberOfPlans:
                    type: number
                  numberOfFreePlans:
                    type: number
                  numberOfPaidPlans:
                    type: number
                  numberOfAddOns:
                    type: number
                  numberOfReplacementAddons:
                    type: number
                  numberOfExtensionAddons:
                    type: number
                  configurationSpaceSize:
                    type: number
                  minSubscriptionPrice:
                    type: number
                  maxSubscriptionPrice:
                    type: number
            example:
              name: "Zoom"

    CollectionCreate:
      description: Collection creation object
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
            properties:
              name:
                type: string
                description: Name of the collection to be created
                example: "MyCollection"
              description:
                type: string
                description: Description of the collection to be created
                example: "This is my collection of pricings for video conferencing tools."
              private:
                type: boolean
                description: Whether the collection to be created should be private or not
                default: false
              pricings:
                type: array
                description: List of pricing names to be added to the collection upon creation
                items:
                  type: string
                example: ["Zoom", "Google Meet"]

    CollectionBulkCreate:
      description: Collection bulk creation object
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - zip
            properties:
              name:
                type: string
                description: Name of the collection to be created
                example: "MyCollection"
              description:
                type: string
                description: Description of the collection to be created
                example: "This is my collection of pricings for video conferencing tools."
              private:
                type: boolean
                description: Whether the collection to be created should be private or not
                default: false
              zip:
                type: string
                format: binary
                description: |
                  **Zip archive containing the pricing definitions to be added to the collection upon creation.**

                  The archive must follow the directory structure defined below:

                  {saasName}/
                  ├── {version}.yaml
                  └── {version}.yml

                  - Each top-level directory (`{saasName}`) represents a distinct pricing entity (e.g., a Software as a Service offering).
                  - Inside each directory, each file represents a specific version of that pricing.
                  - File names must correspond to the version identifier (e.g., `1.0.0.yaml`).
                  - Each file must contain a valid pricing definition encoded in YAML format.

                  **Constraints:**
                  - Only `.yaml` or `.yml` files are supported.
                  - The version identifier must be unique within each `{saasName}` directory.
                  - The YAML content must conform to the expected pricing schema.
  
    CollectionUpdate:
      description: Collection metadata update object. (All fields are optional, but at least one must be provided)
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: Name of the collection
                example: "MyCollection"
              description:
                type: string
                description: Description of the collection
                example: "This is my collection of pricings for video conferencing tools."
              owner:
                type: string
                description: New owner's username for the collection
                example: "john_doe"
              private:
                type: boolean
                description: Whether the collection should be private or not
                default: false
              analytics:
                type: object
                properties:
                  evolutionOfPlans:
                    $ref: '#/components/schemas/ParameterEvolution'
                  evolutionOfFeatures:
                    $ref: '#/components/schemas/ParameterEvolution'
                  evolutionOfAddOns:
                    $ref: '#/components/schemas/ParameterEvolution'
                  evolutionOfConfigurationSpaceSize:
                    $ref: '#/components/schemas/ParameterEvolution'



    CacheSetRequest:
      description: Request object for setting a value in the cache
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - key
              - value
            properties:
              key:
                type: string
                description: The cache key under which to store the value
                example: "user_preferences_123"
              value:
                type: object
                description: The value to store. Can be any JSON-serializable object
                example: { "theme": "dark", "language": "es", "notifications": true }
              expirationInSeconds:
                type: integer
                description: Optional expiration time in seconds. If not provided, defaults to 300 seconds (5 minutes)
                minimum: 1
                example: 3600

    OrganizationCreate:
      description: |
        Request body for creating a new organization. The authenticated user becomes
        the OWNER of the created organization.
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: |
                  URL-safe unique identifier for the organization. Required unless
                  `isPersonal` is `true` (in which case it is auto-set to the user's
                  username). Must be 3-50 characters, lowercase letters, digits, hyphens,
                  and underscores only. Must be unique across the platform.
                example: "acme-corp"
                minLength: 3
                maxLength: 50
                pattern: '^[a-z0-9_-]+$'
              displayName:
                type: string
                description: Human-readable name for the organization (required, max 255 chars)
                example: "Acme Corporation"
                maxLength: 255
              description:
                type: string
                nullable: true
                description: Optional free-text description of the organization
                example: "The leading provider of SaaS solutions"
              isPersonal:
                type: boolean
                description: |
                  Whether this is a personal organization. When `true`, the `name` field
                  is automatically overridden with the authenticated user's username.
                  Personal organizations cannot be deleted.
                default: false
                example: false
              _parentId:
                type: string
                description: |
                  ID of a parent organization. When provided, the new organization becomes
                  a child of the specified parent. The `ancestors` array is automatically
                  computed from the parent's ancestry chain. Users with membership in
                  ancestor organizations automatically inherit role-based access to the
                  new child organization.
                example: "68050bd09890322c57842f6f"

    OrganizationUpdate:
      description: |
        Request body for updating organization metadata. All fields are optional, but at
        least one should be provided. The `name` field cannot be changed after creation.
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              displayName:
                type: string
                description: Updated human-readable name for the organization (max 255 chars)
                example: "Acme Corporation Updated"
                maxLength: 255
              description:
                type: string
                nullable: true
                description: Updated description (set to `null` to clear)
                example: "Updated description"
              avatar:
                type: string
                nullable: true
                description: Updated avatar URL (set to `null` to clear)
                example: "https://sphere.score.us.es/static/avatars/orgs/new-avatar.png"

    BulkChildOrganizationsCreate:
      description: Request body for creating multiple direct child organizations.
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - organizations
            properties:
              organizations:
                type: array
                minItems: 1
                maxItems: 100
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - name
                    - displayName
                  properties:
                    name:
                      type: string
                      minLength: 3
                      maxLength: 50
                      pattern: '^[a-z0-9_-]+$'
                      example: "acme-research"
                    displayName:
                      type: string
                      minLength: 1
                      maxLength: 255
                      example: "Acme Research"
                    description:
                      type: string
                      example: "Research division"

    AddMember:
      description: |
        Request body for adding a user to an organization. Unlike `POST /orgs/join/{code}`
        (which always assigns `MEMBER` role), this endpoint allows assigning any role.
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - userId
              - role
            properties:
              userId:
                type: string
                description: The MongoDB ObjectId of the user to add as a member
                example: "68050bd09890322c57842f71"
              role:
                type: string
                enum: [OWNER, ADMIN, MEMBER]
                description: |
                  The role to assign to the new member:
                  - **OWNER**: Full control over the organization
                  - **ADMIN**: Can manage members and invitations
                  - **MEMBER**: Basic access to organization resources
                example: "MEMBER"

    UpdateMemberRole:
      description: |
        Request body for changing a member's role within the organization. The system
        automatically recalculates an internal role weight used for sorting.
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - role
            properties:
              role:
                type: string
                enum: [OWNER, ADMIN, MEMBER]
                description: |
                  The new role to assign to the member:
                  - **OWNER**: Full control over the organization
                  - **ADMIN**: Can manage members and invitations
                  - **MEMBER**: Basic access to organization resources
                example: "ADMIN"

    CreateInvitation:
      description: |
        Request body for creating an organization invitation. All fields are optional.
        The invitation code is auto-generated as a 10-character hex string.
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              expiresInDays:
                type: integer
                description: |
                  Number of days until the invitation expires. Default is 7 days.
                  Must be a positive integer. The expiration is calculated from the
                  current timestamp.
                minimum: 1
                example: 7
              maxUses:
                type: integer
                description: |
                  Maximum number of times this invitation can be accepted. Default is
                  `null` (unlimited). Once the limit is reached, the invitation can no
                  longer be used.
                minimum: 1
                example: 10

    SetPermissionRequest:
      description: Request to set entity permissions for a user
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - userId
              - entityType
              - permissions
            properties:
              userId:
                type: string
                description: The MongoDB ObjectId of the user to grant permissions to
                example: "68050bd09890322c57842f71"
              entityType:
                type: string
                enum: [pricing, collection]
                description: The type of entity to set permissions for
                example: "pricing"
              entitySlug:
                type: string
                nullable: true
                description: >-
                  The URL-friendly slug of the entity (pricing name or collection name).
                  Use null for org-scoped permissions (e.g. CREATE permission at the
                  organization level).
                example: "zoom"
              permissions:
                $ref: '#/components/schemas/EntityPermissions'

    BulkSetPermissionsRequest:
      description: Request to create or update entity permissions in bulk
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - permissions
            properties:
              permissions:
                type: array
                minItems: 1
                maxItems: 100
                items:
                  $ref: '#/components/schemas/BulkPermissionItem'

  responses:
    PricingList:
      description: A list of pricings matching the provided filter
      content:
        application/json:
          schema:
            type: object
            properties:
              total:
                type: integer
                description: Total number of pricings matching the provided filter (without pagination)
                example: 250
              minPrice:
                type: object
                description: Minimum price stats for the pricings matching the provided filter (without pagination)
                properties:
                  min:
                    type: number
                    description: The minimum min price amount used for filtering
                    example: 10.00
                  max:
                    type: number
                    description: The maximum min price amount used for filtering
                    example: 100.00
                  data:
                    type: object
                    description: An object containing the count of pricings for each min price amount (without pagination)
                    additionalProperties:
                      type: object
                      properties:
                        value:
                          type: string
                          description: Range of min price values
                          example: 10-20
                  percentileIndex:
                    type: number
                    example: 62
              maxPrice:
                type: object
                description: Maximum price stats for the pricings matching the provided filter (without pagination)
                properties:
                  min:
                    type: number
                    description: The minimum max price amount used for filtering
                    example: 10.00
                  max:
                    type: number
                    description: The maximum max price amount used for filtering
                    example: 100.00
                  data:
                    type: object
                    description: An object containing the count of pricings for each max price amount (without pagination)
                    additionalProperties:
                      type: object
                      properties:
                        value:
                          type: string
                          description: Range of max price values
                          example: 10-20
                  percentileIndex:
                    type: number
                    example: 62
              configurationSpaceSize:
                type: object
                description: Configuration space size stats for the pricings matching the provided filter (without pagination)
                properties:
                  min:
                    type: number
                    description: The minimum configuration space size used for filtering
                    example: 10.00
                  max:
                    type: number
                    description: The maximum configuration space size used for filtering
                    example: 100.00
                  data:
                    type: object
                    description: An object containing the count of pricings for each configuration space size (without pagination)
                    additionalProperties:
                      type: object
                      properties:
                        value:
                          type: string
                          description: Range of configuration space size values
                          example: 10-20
                  percentileIndex:
                    type: number
                    example: 62

              pricings:
                type: array
                items:
                  $ref: '#/components/schemas/Pricing'
    
    CollectionList:
      description: A list of pricing collections matching the provided filter
      content:
        application/json:
          schema:
            type: object
            properties:
              collections:
                type: array
                items:
                  $ref: '#/components/schemas/PublicPricingCollection'
              total:
                type: integer
                description: Total number of collections matching the provided filter (without pagination)
                example: 50
    
    UserCollectionList:
      description: A list of a user's pricing collections
      content:
        application/json:
          schema:
            type: object
            properties:
              collections:
                type: array
                items:
                  $ref: '#/components/schemas/PublicPricingCollection'

    UnprocessableEntity:
      description: Request sent could not be processed properly
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/FieldValidationError'

    CacheGetResponse:
      description: Response object for getting a value from the cache
      content:
        application/json:
          schema:
            type: object
            description: Response from cache GET operation
            properties:
              data:
                type: object
                nullable: true
                description: The cached value, or null if key does not exist
                example: { "userId": "123", "preferences": { "theme": "dark" } }

    CacheSetResponse:
      description: Response object for setting a value in the cache
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Cache set successfully"

  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      description: |
        The MongoDB ObjectId of the organization. The middleware automatically resolves
        the organization context from this parameter — loading the organization and
        determining the authenticated user's role within it.
      schema:
        type: string
        example: "68050bd09890322c57842f6f"

    Username:
      name: username
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Username'

    CollectionSlug:
      name: collectionSlug
      in: path
      required: true
      description: The URL-safe slug identifier of the collection (e.g., "my-collection")
      schema:
        type: string
        example: "my-collection"
    
    PricingSlug:
      name: pricingSlug
      in: path
      required: true
      description: The URL-friendly slug identifier of the pricing (auto-generated from name)
      schema:
        type: string
        example: "zoom"

    PricingVersion:
      name: pricingVersion
      in: path
      required: true
      schema:
        type: string

    PermissionId:
      name: permissionId
      in: path
      required: true
      description: |
        The MongoDB ObjectId of the entity permission record. Used to identify which
        permission to remove when deleting entity permissions.
      schema:
        type: string
        example: "68050bd09890322c57842f80"

    UsernameQuery:
      name: username
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Username'

    Email:
      name: email
      in: query
      required: false
      schema:
        type: string
        format: email
    
    Role:
      name: role
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Role'

    SortByUsers:
      name: sortBy
      in: query
      required: false
      schema:
        type: string
        enum: [username, email]
        example: username

    Name:
      name: name
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Name'
    
    SortByPricings:
      name: sortBy
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/SortByPricings'

    OrganizationIds:
      name: organizationIds
      in: query
      required: false
      description: Comma-separated list of organization IDs to filter by. Non-admin users can only filter by organizations they belong to; non-member organization IDs are ignored. When omitted, results include all accessible organizations.
      schema:
        type: string
        example: "68050bd09890322c57842f6f,68050bd09890322c57842f70"

    SortByCollections:
      name: sortBy
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/SortByCollections'
    
    Sort:
      name: sort
      in: query
      required: false      
      schema:
        $ref: '#/components/schemas/Sort'

    MinSubscription:
      name: min-subscription
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/MinSubscription'

    MaxSubscription:
      name: max-subscription
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/MaxSubscription'

    MinMinPrice:
      name: min-minPrice
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/MinMinPrice'
    
    MaxMinPrice:
      name: max-minPrice
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/MaxMinPrice'

    MinMaxPrice:
      name: min-maxPrice
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/MinMaxPrice'
    
    MaxMaxPrice:
      name: max-maxPrice
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/MaxMaxPrice'

    SelectedOwners:
      name: selectedOwners
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/SelectedOwners'

    Limit:
      name: limit
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Limit'
    Offset:
      name: offset
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Offset'

    CollectionQuery:
      name: collection
      description: The slug identifier of the collection to filter pricings by (only pricings that are in this collection will be included in the results)
      in: query
      required: true
      schema:
        type: string
        example: "my-collection"

    ExcludePricingsInCollection:
      name: excludePricingsInCollection
      description: If set to "true", only pricings that are NOT in any collection will be returned. Cannot be used together with the `collection` parameter.
      in: query
      required: false
      schema:
        type: string
        enum: ["true", "false"]
        example: "true"

    CollectionCascade:
      name: cascade
      description: Whether to delete all pricings contained in the collection as well (if not provided, the collection will only be deleted if it does not contain any pricings, otherwise an error will be returned)
      in: query
      required: false
      schema:
        type: boolean

    OrganizationId:
      name: organizationId
      in: path
      required: true
      description: |
        The MongoDB ObjectId of the organization. The middleware automatically resolves
        the organization context from this parameter — loading the organization and
        determining the authenticated user's role within it.
      schema:
        type: string
        example: "68050bd09890322c57842f6f"

    UserId:
      name: userId
      in: path
      required: true
      description: |
        The MongoDB ObjectId of the user. Used in member management endpoints to identify
        which user to add, update, or remove from an organization.
      schema:
        type: string
        example: "68050bd09890322c57842f71"

    InvitationId:
      name: invitationId
      in: path
      required: true
      description: |
        The MongoDB ObjectId of the invitation. Used to identify which invitation to
        revoke when deleting from an organization.
      schema:
        type: string
        example: "68050bd09890322c57842f72"

    InvitationCode:
      name: code
      in: path
      required: true
      description: |
        The unique invitation code (10-character hex string) generated when the invitation
        was created. Used to preview or accept an invitation. This code is shareable and
        is included in the invitation join URL.
      schema:
        type: string
        example: "a1b2c3d4e5"

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: |
        API Key for authentication. Two types are supported:
        - **User API Key** (format: `usr_*`): Obtained from `POST /users/login` endpoint.
          Provides access based on the user's role (ADMIN or USER).
        - **Organization API Key** (format: `org_*`): Created in organization settings.
          Provides access scoped to the organization's resources.

        Include the token directly in the `Authorization` header **without** a `Bearer` prefix.
