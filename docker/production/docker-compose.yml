services:
  mongodb:
      image: mongo:7.0.16
      ports:
        - "27017:27017"
      env_file:
        - ../../api/.env.production
      volumes:
        - 'sphere-mongodb:/data/db'
        - '../../api/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh'
      networks:
        - sphere-network
  redis:
    image: redis:7.4.2
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
    volumes:
      - 'redis_data:/data'
    networks:
      - sphere-network
  mongo-express:
    image: mongo-express:latest
    restart: unless-stopped
    environment:
      ME_CONFIG_SITE_BASEURL: /db-admin/
      ME_CONFIG_MONGODB_URL: ${MONGO_EXPRESS_URL}
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-password}
    ports:
      - "8081:8081"
    networks:
      - sphere-network
  choco-analysis-engine:
    image: ghcr.io/scorelabus/choco-pricing-analysis-engine:1.2.1@sha256:28adc8f3f1770176a6939521b22d526fad69eb18a48c11ca1e5d19578fe24424
    container_name: choco-analysis-engine
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
      # AÑADE ESTO:
      - HTTP_PROXY=http://proxy.int.local:3128
      - HTTPS_PROXY=http://proxy.int.local:3128
      - NO_PROXY=127.0.0.1,localhost,analysis-engine,mcp-server,analysis-engine,choco-analysis-engine
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - sphere-network
  analysis-engine:
    image: ghcr.io/scorelabus/pricing-analysis-engine:1.2.1@sha256:a3fff780acc47eb64f66b67a7a29c68a20916932c7afadeeccbfaa772fc33e37
    container_name: pricing-analysis-engine
    init: true
    ports:
      - "8002:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CHOCO_API=http://choco-analysis-engine:8000
      - LOG_LEVEL=INFO
      # AÑADE ESTO:
      - HTTP_PROXY=http://proxy.int.local:3128
      - HTTPS_PROXY=http://proxy.int.local:3128
      - NO_PROXY=127.0.0.1,localhost,analysis-engine,mcp-server,analysis-engine,choco-analysis-engine
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - choco-analysis-engine
    restart: unless-stopped
    networks:
      - sphere-network
  a-mint:
    image: ghcr.io/scorelabus/a-mint:1.2.1@sha256:603a6ad8e7174973a23259b53c24186ae5fff133d4369b6233548a2807deeb78
    container_name: a-mint
    init: true
    ports:
      - "8001:8000"
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - PORT=8000
      - OPENAI_API_KEY=${AMINT_API_KEY}
      - OPENAI_API_KEYS=${AMINT_API_KEYS}
      - ANALYSIS_API=http://analysis-engine:3000/api/v1
      - LOG_LEVEL=INFO
      # AÑADE ESTO:
      - HTTP_PROXY=http://proxy.int.local:3128
      - HTTPS_PROXY=http://proxy.int.local:3128
      - NO_PROXY=127.0.0.1,localhost,analysis-engine,mcp-server,analysis-engine,choco-analysis-engine
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    depends_on:
      - analysis-engine
    networks:
      - sphere-network
  mcp-server:
    image: ghcr.io/scorelabus/pi-mcp-server:1.2.1@sha256:012abd8a640fe32310feab57af42aec2a7109d76ce749b3f4513376a5be35f59
    container_name: mcp-server
    environment:
      - AMINT_BASE_URL=http://a-mint:8000
      - ANALYSIS_BASE_URL=http://analysis-engine:3000
      - CACHE_BACKEND=memory
      - LOG_LEVEL=INFO
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8085
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8085
      - MCP_TRANSPORT=sse
      # AÑADE ESTO:
      - HTTP_PROXY=http://proxy.int.local:3128
      - HTTPS_PROXY=http://proxy.int.local:3128
      - NO_PROXY=127.0.0.1,localhost,analysis-engine,a-mint,mcp-server,analysis-engine,choco-analysis-engine
    ports:
      - "8085:8085"
    depends_on:
      - a-mint
      - analysis-engine
    restart: unless-stopped
    networks:
      - sphere-network
  harvey:
    image: ghcr.io/scorelabus/harvey:1.2.1@sha256:e89c2927ae19050da5e7b352514a4011462d194bd8b330008e25b842521807f5
    container_name: harvey
    env_file: .env
    ports:
      - "8086:8086"
    environment:
      - LOG_LEVEL=INFO
      - OPENAI_API_KEY=${HARVEY_API_KEY}
      - OPENAI_MODEL=gpt-5-nano
      - AMINT_BASE_URL=http://a-mint:8000
      - ANALYSIS_BASE_URL=http://analysis-engine:3000
      - CACHE_BACKEND=memory
      - MCP_TRANSPORT=sse
      - MCP_SERVER_URL=http://mcp-server:8085/sse
      # AÑADE ESTO:
      - HTTP_PROXY=http://proxy.int.local:3128
      - HTTPS_PROXY=http://proxy.int.local:3128
      - NO_PROXY=127.0.0.1,localhost,analysis-engine,a-mint,mcp-server,analysis-engine,choco-analysis-engine
    depends_on:
      - a-mint
      - analysis-engine
      - mcp-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - sphere-network
  server:
    restart: always
    container_name: sphere-server
    build:
        context: ../../api
        dockerfile: ./docker/production/Dockerfile
    ports:
      - 8080:8080
    env_file:
      - ../../api/.env.production
      - .env
    environment:
      # ORBIT, the assistant, uses the same model and key as HARVEY, so they share
      # OpenAI's rate limits: ORBIT caps the messages of all its users per minute.
      - ORBIT_OPENAI_API_KEY=${HARVEY_API_KEY}
      - ORBIT_OPENAI_MODEL=gpt-5-nano
      - ORBIT_MAX_MESSAGES_PER_MINUTE=20
      # Single deployment switch shared with the API gateway.
      - AUTH_PROVIDER=${AUTH_PROVIDER:-local}
    volumes:
      - 'sphere-statics:/usr/src/server/public'
      - ../../api/public/static/pricings/templates/petclinic.yml:/usr/src/server/public/pricings/templates/petclinic.yml
      - ../../api/public/static/avatars:/usr/src/server/public/static/avatars
    depends_on:
      - mongodb
      - redis
    links:
      - mongodb
      - redis
    networks:
      - sphere-network
  client:
    restart: always
    container_name: sphere-client
    build:
        context: ../../frontend
        dockerfile: ./docker/production/Dockerfile
        secrets:
          - gh_token
    ports:
      - 5173:5173
    env_file:
      - ../../frontend/.env.production
    networks:
      - sphere-network
  nginx:
    restart: always
    container_name: sphere-nginx
    build:
        context: ../../nginx/production
        dockerfile: ./Dockerfile
    environment:
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      SCORETECH_IDENTITY_UPSTREAM: ${SCORETECH_IDENTITY_UPSTREAM:-scoretech-identity-gateway:8080}
      SCORETECH_IDENTITY_PREVIEW: ${SCORETECH_IDENTITY_PREVIEW:-false}
    ports:
      - 80:80
      - 443:443
    depends_on:
      - server
      - client
      - harvey
    volumes:
      - '../../nginx/production/ssl:/etc/nginx/ssl'
    networks:
      - sphere-network
volumes:
  sphere-mongodb:
    driver: local
  sphere-statics:
    driver: local
  redis_data:
    driver: local
networks:
  sphere-network:
    driver: bridge
secrets:
  gh_token:
    file: ../gh_pat.txt
