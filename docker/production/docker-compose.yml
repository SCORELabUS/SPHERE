services:
  mongo-keyfile:
      image: mongo:7.0.16
      entrypoint: ["/bin/bash", "-c"]
      command:
        - |
          if [ ! -s /keyfile/mongodb-keyfile ]; then
            openssl rand -base64 756 > /keyfile/mongodb-keyfile
          fi
          chmod 400 /keyfile/mongodb-keyfile
          chown 999:999 /keyfile/mongodb-keyfile
      volumes:
        - 'mongo-keyfile:/keyfile'

  mongodb:
      image: mongo:7.0.16
      command: ["mongod", "--replSet", "rs0", "--keyFile", "/keyfile/mongodb-keyfile", "--bind_ip_all"]
      ports:
        - "27017:27017"
      env_file:
        - ../../api/.env.production
      depends_on:
        mongo-keyfile:
          condition: service_completed_successfully
      volumes:
        - 'sphere-mongodb:/data/db'
        - 'mongo-keyfile:/keyfile:ro'
        - '../../api/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh'
      networks:
        - sphere-network
      healthcheck:
        test: ["CMD-SHELL", "mongosh --quiet --host localhost --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
        interval: 5s
        timeout: 5s
        retries: 20

  mongo-rs-init:
      image: mongo:7.0.16
      env_file:
        - ../../api/.env.production
      depends_on:
        mongodb:
          condition: service_healthy
      entrypoint: ["/bin/bash", "-c"]
      command:
        - |
          mongosh --quiet "mongodb://$$MONGO_INITDB_ROOT_USERNAME:$$MONGO_INITDB_ROOT_PASSWORD@mongodb:27017/admin" --eval '
            try {
              rs.status();
            } catch (error) {
              rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] });
            }
          '
      networks:
        - sphere-network
  redis:
    image: redis:7.4.2
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
    volumes:
      - 'redis_data:/data'
    networks:
      - sphere-network
  mongo-express:
    image: mongo-express:latest
    restart: unless-stopped
    environment:
      ME_CONFIG_SITE_BASEURL: /db-admin/
      ME_CONFIG_MONGODB_URL: ${MONGO_EXPRESS_URL}
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-password}
    ports:
      - "8081:8081"
    networks:
      - sphere-network
  choco-analysis-engine:
    image: aleexgf/choco-pricing-analysis-engine:main
    container_name: choco-analysis-engine
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
      # AÑADE ESTO:
      - HTTP_PROXY=http://proxy.int.local:3128
      - HTTPS_PROXY=http://proxy.int.local:3128
      - NO_PROXY=127.0.0.1,localhost,analysis-engine,mcp-server,analysis-engine,choco-analysis-engine
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - sphere-network
  analysis-engine:
    image: aleexgf/pricing-analysis-engine:main
    container_name: pricing-analysis-engine
    init: true
    ports:
      - "8002:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CHOCO_API=http://choco-analysis-engine:8000
      - LOG_LEVEL=INFO
      # AÑADE ESTO:
      - HTTP_PROXY=http://proxy.int.local:3128
      - HTTPS_PROXY=http://proxy.int.local:3128
      - NO_PROXY=127.0.0.1,localhost,analysis-engine,mcp-server,analysis-engine,choco-analysis-engine
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - choco-analysis-engine
    restart: unless-stopped
    networks:
      - sphere-network
  a-mint:
    image: aleexgf/a-mint:main
    container_name: a-mint
    init: true
    ports:
      - "8001:8000"
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - PORT=8000
      - OPENAI_API_KEY=${AMINT_API_KEY}
      - OPENAI_API_KEYS=${AMINT_API_KEYS}
      - ANALYSIS_API=http://analysis-engine:3000/api/v1
      - LOG_LEVEL=INFO
      # AÑADE ESTO:
      - HTTP_PROXY=http://proxy.int.local:3128
      - HTTPS_PROXY=http://proxy.int.local:3128
      - NO_PROXY=127.0.0.1,localhost,analysis-engine,mcp-server,analysis-engine,choco-analysis-engine
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    depends_on:
      - analysis-engine
    networks:
      - sphere-network
  mcp-server:
    image: aleexgf/pi-mcp-server:main
    container_name: mcp-server
    environment:
      - AMINT_BASE_URL=http://a-mint:8000
      - ANALYSIS_BASE_URL=http://analysis-engine:3000
      - CACHE_BACKEND=memory
      - LOG_LEVEL=INFO
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8085
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8085
      - MCP_TRANSPORT=sse
      # AÑADE ESTO:
      - HTTP_PROXY=http://proxy.int.local:3128
      - HTTPS_PROXY=http://proxy.int.local:3128
      - NO_PROXY=127.0.0.1,localhost,analysis-engine,a-mint,mcp-server,analysis-engine,choco-analysis-engine
    ports:
      - "8085:8085"
    depends_on:
      - a-mint
      - analysis-engine
    restart: unless-stopped
    networks:
      - sphere-network
  harvey:
    image: aleexgf/harvey:main
    container_name: harvey
    env_file: .env
    ports:
      - "8086:8086"
    environment:
      - LOG_LEVEL=INFO
      - OPENAI_API_KEY=${HARVEY_API_KEY}
      - OPENAI_MODEL=gpt-5-nano
      - AMINT_BASE_URL=http://a-mint:8000
      - ANALYSIS_BASE_URL=http://analysis-engine:3000
      - CACHE_BACKEND=memory
      - MCP_TRANSPORT=sse
      - MCP_SERVER_URL=http://mcp-server:8085/sse
      # AÑADE ESTO:
      - HTTP_PROXY=http://proxy.int.local:3128
      - HTTPS_PROXY=http://proxy.int.local:3128
      - NO_PROXY=127.0.0.1,localhost,analysis-engine,a-mint,mcp-server,analysis-engine,choco-analysis-engine
    depends_on:
      - a-mint
      - analysis-engine
      - mcp-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - sphere-network
  server:
    restart: always
    container_name: sphere-server
    build:
        context: ../../api
        dockerfile: ./docker/production/Dockerfile
    ports:
      - 8080:8080
    env_file:
      - ../../api/.env.production
      - .env
    environment:
      MONGO_REPLICA_SET: rs0
    volumes:
      - 'sphere-statics:/usr/src/server/public'
      - ../../api/public/static/pricings/templates/petclinic.yml:/usr/src/server/public/pricings/templates/petclinic.yml
      - ../../api/public/static/avatars:/usr/src/server/public/static/avatars
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-rs-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    links:
      - mongodb
      - redis
    networks:
      - sphere-network
  client:
    restart: always
    container_name: sphere-client
    build:
        context: ../../frontend
        dockerfile: ./docker/production/Dockerfile
        secrets:
          - gh_token
    ports:
      - 5173:5173
    env_file:
      - ../../frontend/.env.production
    networks:
      - sphere-network
  nginx:
    restart: always
    container_name: sphere-nginx
    build:
        context: ../../nginx/production
        dockerfile: ./Dockerfile
    ports:
      - 80:80
      - 443:443
    depends_on:
      - server
      - client
      - harvey
    volumes:
      - '../../nginx/production/ssl:/etc/nginx/ssl'
    networks:
      - sphere-network
volumes:
  sphere-mongodb:
    driver: local
  mongo-keyfile:
    driver: local
  sphere-statics:
    driver: local
  redis_data:
    driver: local
networks:
  sphere-network:
    driver: bridge
secrets:
  gh_token:
    file: ../gh_pat.txt
