# Routes one public address to SPHERE's containers:
#   /api/v1, /static, /.well-known/oauth-*  -> API (server:8080)
#   /harvey-api/                             -> HARVEY (harvey:8086, ai profile)
#   everything else                          -> web client (client:80)

# Per-IP limits, the first barrier against floods. The API also limits each
# signed-in user on its own.
limit_req_zone $binary_remote_addr zone=sphere_api:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=sphere_harvey:10m rate=20r/s;
limit_req_status 429;

# Behind an HTTPS proxy, keep the scheme it reports.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Docker's DNS. Looking HARVEY up per request lets nginx start without the ai
# profile; requests to /harvey-api then answer 502.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    client_max_body_size 100M;
    large_client_header_buffers 8 64k;
    client_header_buffer_size 64k;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection        "";
    proxy_read_timeout 500s;

    location /api/v1 {
        limit_req  zone=sphere_api burst=100 nodelay;
        proxy_pass http://server:8080;
    }

    location /static/ {
        proxy_pass http://server:8080;
    }

    # OAuth discovery, used by assistants that connect to the MCP server.
    location /.well-known/oauth- {
        proxy_pass http://server:8080;
    }

    location /harvey-api/ {
        limit_req  zone=sphere_harvey burst=40 nodelay;
        set $harvey http://harvey:8086;
        rewrite ^/harvey-api/(.*)$ /$1 break;
        # HARVEY streams its answers (server-sent events).
        proxy_buffering off;
        proxy_cache off;
        proxy_pass $harvey;
    }

    location / {
        proxy_pass http://client:80;
    }
}
