services:
  mongo-keyfile:
      image: mongo:7.0.16
      entrypoint: ["/bin/bash", "-c"]
      command:
        - |
          if [ ! -s /keyfile/mongodb-keyfile ]; then
            openssl rand -base64 756 > /keyfile/mongodb-keyfile
          fi
          chmod 400 /keyfile/mongodb-keyfile
          chown 999:999 /keyfile/mongodb-keyfile
      volumes:
        - 'mongo-keyfile:/keyfile'

  mongodb:
      image: mongo:7.0.16
      command: ["mongod", "--replSet", "rs0", "--keyFile", "/keyfile/mongodb-keyfile", "--bind_ip_all"]
      ports:
        - "27017:27017"
      env_file:
        - ../../api/.env.testing
      depends_on:
        mongo-keyfile:
          condition: service_completed_successfully
      volumes:
        - 'sphere-mongodb:/data/db'
        - 'mongo-keyfile:/keyfile:ro'
        - '../../api/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh'
      networks:
        - testing-network
      healthcheck:
        test: ["CMD-SHELL", "mongosh --quiet --host localhost --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
        interval: 5s
        timeout: 5s
        retries: 20

  mongo-rs-init:
      image: mongo:7.0.16
      env_file:
        - ../../api/.env.testing
      depends_on:
        mongodb:
          condition: service_healthy
      entrypoint: ["/bin/bash", "-c"]
      command:
        - |
          mongosh --quiet "mongodb://$$MONGO_INITDB_ROOT_USERNAME:$$MONGO_INITDB_ROOT_PASSWORD@mongodb:27017/admin" --eval '
            try {
              rs.status();
            } catch (error) {
              rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] });
            }
          '
      networks:
        - testing-network
  redis:
    image: redis:7.4.2
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
    volumes:
      - 'redis_data:/data'
    networks:
      - testing-network
  server:
    restart: always
    container_name: sphere-server
    build:
        context: ../../api
        dockerfile: ./docker/Dockerfile
    ports:
      - 8080:8080
    env_file:
      - ../../api/.env.testing
    volumes:
      - 'sphere-statics:/usr/src/server/public'
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-rs-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    links:
      - mongodb
      - redis
    networks:
      - testing-network
  client:
    restart: always
    container_name: sphere-client
    build:
      context: ../../frontend
      dockerfile: ./docker/Dockerfile
      secrets:
        - gh_token
    ports:
      - 5173:5173
    env_file:
      - ../../frontend/.env.testing
    networks:
      - testing-network
  nginx:
    restart: always
    container_name: sphere-nginx
    build:
        context: ../../nginx/local
        dockerfile: ./Dockerfile
    ports:
      - 80:80
    depends_on:
      - server
      - client
    networks:
      - testing-network
volumes:
  sphere-mongodb:
    driver: local
  mongo-keyfile:
    driver: local
  sphere-statics:
    driver: local
  redis_data:
    driver: local
networks:
  testing-network:
    driver: bridge
secrets:
  gh_token:
    file: ../gh_pat.txt
