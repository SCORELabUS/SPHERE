services:
  mongodb:
      image: mongo:7.0.16
      ports:
        - "27017:27017"
      env_file:
        # raw: values such as the admin password hash contain '$' and must not
        # be interpolated by Compose.
        - path: ../../api/.env.testing
          format: raw
      volumes:
        - 'sphere-mongodb:/data/db'
        - '../../api/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh'
      networks:
        - testing-network
  redis:
    image: redis:7.4.2
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
    volumes:
      - 'redis_data:/data'
    networks:
      - testing-network
  server:
    restart: always
    container_name: sphere-server
    build:
        context: ../../api
        dockerfile: ./docker/Dockerfile
    ports:
      - 8080:8080
    env_file:
      # raw: values such as the admin password hash contain '$' and must not
      # be interpolated by Compose.
      - path: ../../api/.env.testing
        format: raw
    environment:
      # Links in emails (printed in the logs here) point to nginx.
      - FRONTEND_URL=http://localhost
    # Loads the demo data into an empty database, then runs the image's
    # entrypoint (migrations and API).
    command: ["sh", "-c", "sh ./scripts/seed-demo.sh && exec /usr/src/server/entrypoint.sh"]
    volumes:
      - 'sphere-statics:/usr/src/server/public'
      - '../../api/public/static/pricings/originalDataset:/usr/src/server/demo/originalDataset:ro'
      - './seed-demo.sh:/usr/src/server/scripts/seed-demo.sh:ro'
      - './seed-demo.ts:/usr/src/server/scripts/seed-demo.ts:ro'
    depends_on:
      - mongodb
      - redis
    links:
      - mongodb
      - redis
    networks:
      - testing-network
  client:
    restart: always
    container_name: sphere-client
    build:
      context: ../../frontend
      dockerfile: ./docker/Dockerfile
    ports:
      - 5173:5173
    env_file:
      - ../../frontend/.env.testing
    networks:
      - testing-network
  nginx:
    restart: always
    container_name: sphere-nginx
    build:
        context: ../../nginx/local
        dockerfile: ./Dockerfile
    ports:
      - 80:80
    depends_on:
      - server
      - client
    networks:
      - testing-network
volumes:
  sphere-mongodb:
    driver: local
  sphere-statics:
    driver: local
  redis_data:
    driver: local
networks:
  testing-network:
    driver: bridge
