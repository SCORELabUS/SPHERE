services:
  mongodb:
      image: mongo:7.0.16
      ports:
        - "27017:27017"
      env_file:
        - ../../api/.env.testing
      volumes:
        - 'sphere-mongodb:/data/db'
        - '../../api/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh'
      networks:
        - testing-network
  redis:
    image: redis:7.4.2
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
    volumes:
      - 'redis_data:/data'
    networks:
      - testing-network
  choco-analysis-engine:
    image: ghcr.io/scorelabus/choco-pricing-analysis-engine:1.3.0@sha256:3f3b8e631b4d14b73ed53108d77c13a07180406d326deb48e924ddb6d4565b6c
    container_name: choco-analysis-engine
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - testing-network
  analysis-engine:
    image: ghcr.io/scorelabus/pricing-analysis-engine:1.3.0@sha256:b4489dc79f1f19877884d45bdcf98db45abb92af72c9df1f3f1a0f0f86aba7ba
    container_name: pricing-analysis-engine
    ports:
      - "8002:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CHOCO_API=http://choco-analysis-engine:8000
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - choco-analysis-engine
    restart: unless-stopped
    networks:
      - testing-network
  a-mint:
    image: ghcr.io/scorelabus/a-mint:1.3.0@sha256:bb0ec9436fa6b84a6a16227d9acd10f2c04e90f244a47d5ec2c3020f3818cb51
    container_name: a-mint
    ports:
      - "8001:8000"
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - PORT=8000
      - OPENAI_API_KEY=${AMINT_API_KEY}
      - OPENAI_API_KEYS=${AMINT_API_KEYS}
      - ANALYSIS_API=http://analysis-engine:3000/api/v1
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    depends_on:
      - analysis-engine
    networks:
      - testing-network
  mcp-server:
    image: ghcr.io/scorelabus/pi-mcp-server:1.3.0@sha256:baa89c353dacf8610c0d08dd28d4892abfc043b9ee931ab4441c7344f16c8033
    container_name: mcp-server
    environment:
      - AMINT_BASE_URL=http://a-mint:8000
      - ANALYSIS_BASE_URL=http://analysis-engine:3000
      - CACHE_BACKEND=memory
      - LOG_LEVEL=INFO
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8085
    ports:
      - "8085:8085"
    depends_on:
      - a-mint
      - analysis-engine
    restart: unless-stopped
    networks:
      - testing-network
  harvey:
    image: ghcr.io/scorelabus/harvey:1.3.0@sha256:0c5652fd458ebeaa3dc535aca95d05787463f6621db7d83f5859bd0ad0818290
    container_name: harvey
    env_file: .env
    ports:
      - "8086:8086"
    environment:
      - LOG_LEVEL=INFO
      - OPENAI_API_KEY=${HARVEY_API_KEY}
      - OPENAI_MODEL=gpt-5-nano
      - AMINT_BASE_URL=http://a-mint:8000
      - ANALYSIS_BASE_URL=http://analysis-engine:3000
      - CACHE_BACKEND=memory
      - MCP_TRANSPORT=stdio
    depends_on:
      - a-mint
      - analysis-engine
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - testing-network
  server:
    restart: always
    container_name: sphere-server
    build:
        context: ../../api
        dockerfile: ./docker/Dockerfile
    ports:
      - 8080:8080
    env_file:
      - ../../api/.env.testing
    environment:
      # ORBIT, the assistant, uses the same model and key as HARVEY, so they share
      # OpenAI's rate limits: ORBIT caps the messages of all its users per minute.
      - ORBIT_OPENAI_API_KEY=${HARVEY_API_KEY}
      - ORBIT_OPENAI_MODEL=gpt-5-nano
      - ORBIT_MAX_MESSAGES_PER_MINUTE=20
    volumes:
      - 'sphere-statics:/usr/src/server/public'
    depends_on:
      - mongodb
      - redis
    links:
      - mongodb
      - redis
    networks:
      - testing-network
  client:
    restart: always
    container_name: sphere-client
    build:
        context: ../../frontend
        dockerfile: ./docker/Dockerfile
        secrets:
          - gh_token
    ports:
      - 5173:5173
    env_file:
      - ../../frontend/.env.production
    networks:
      - testing-network
  nginx:
    restart: always
    container_name: sphere-nginx
    build:
        context: ../../nginx/local
        dockerfile: ./Dockerfile
    ports:
      - 80:80
    depends_on:
      - server
      - client
    networks:
      - testing-network
volumes:
  sphere-mongodb:
    driver: local
  sphere-statics:
    driver: local
  redis_data:
    driver: local
networks:
  testing-network:
    driver: bridge
secrets:
  gh_token:
    file: ../gh_pat.txt
