services:
  mongodb:
      image: mongo:7.0.16
      ports:
        - "27017:27017"
      env_file:
        - ../../api/.env.testing
      volumes:
        - 'sphere-mongodb:/data/db'
        - '../../api/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh'
      networks:
        - testing-network
  redis:
    image: redis:7.4.2
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
    volumes:
      - 'redis_data:/data'
    networks:
      - testing-network
  choco-analysis-engine:
    image: ghcr.io/isa-group/choco-pricing-analysis-engine:1.2.0@sha256:c08ceca7c599f2e34538fe415dae733ca90707b7e4211e9d933df2a619f674d1
    container_name: choco-analysis-engine
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - testing-network
  analysis-engine:
    image: ghcr.io/isa-group/pricing-analysis-engine:1.2.0@sha256:223e9f0046915430c87d48476c57b2f967a4f29bc70457f20cdd23f47d3c704b
    container_name: pricing-analysis-engine
    ports:
      - "8002:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CHOCO_API=http://choco-analysis-engine:8000
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - choco-analysis-engine
    restart: unless-stopped
    networks:
      - testing-network
  a-mint:
    image: ghcr.io/isa-group/a-mint:1.2.0@sha256:ecd45cd21f50261a4842433f6b6e5a5a10e20924c74eef64c82cdf0ef8d72a56
    container_name: a-mint
    ports:
      - "8001:8000"
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - PORT=8000
      - OPENAI_API_KEY=${AMINT_API_KEY}
      - OPENAI_API_KEYS=${AMINT_API_KEYS}
      - ANALYSIS_API=http://analysis-engine:3000/api/v1
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    depends_on:
      - analysis-engine
    networks:
      - testing-network
  mcp-server:
    image: ghcr.io/isa-group/pi-mcp-server:1.2.0@sha256:13662a931fcb3bc5d97427f979e0b4ad95f05d21ef6d5e7f617dd7ac047a2bdc
    container_name: mcp-server
    environment:
      - AMINT_BASE_URL=http://a-mint:8000
      - ANALYSIS_BASE_URL=http://analysis-engine:3000
      - CACHE_BACKEND=memory
      - LOG_LEVEL=INFO
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8085
    ports:
      - "8085:8085"
    depends_on:
      - a-mint
      - analysis-engine
    restart: unless-stopped
    networks:
      - testing-network
  harvey:
    image: ghcr.io/isa-group/harvey:1.2.0@sha256:1a2aaf4318ff6abdea22752fdc5791c7b2642ab8d1511451c34fbf0ef254fa4c
    container_name: harvey
    env_file: .env
    ports:
      - "8086:8086"
    environment:
      - LOG_LEVEL=INFO
      - OPENAI_API_KEY=${HARVEY_API_KEY}
      - OPENAI_MODEL=gpt-5-nano
      - AMINT_BASE_URL=http://a-mint:8000
      - ANALYSIS_BASE_URL=http://analysis-engine:3000
      - CACHE_BACKEND=memory
      - MCP_TRANSPORT=stdio
    depends_on:
      - a-mint
      - analysis-engine
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - testing-network
  server:
    restart: always
    container_name: sphere-server
    build:
        context: ../../api
        dockerfile: ./docker/Dockerfile
    ports:
      - 8080:8080
    env_file:
      - ../../api/.env.testing
    environment:
      # ORBIT, the assistant, uses the same model and key as HARVEY, so they share
      # OpenAI's rate limits: ORBIT caps the messages of all its users per minute.
      - ORBIT_OPENAI_API_KEY=${HARVEY_API_KEY}
      - ORBIT_OPENAI_MODEL=gpt-5-nano
      - ORBIT_MAX_MESSAGES_PER_MINUTE=20
    volumes:
      - 'sphere-statics:/usr/src/server/public'
    depends_on:
      - mongodb
      - redis
    links:
      - mongodb
      - redis
    networks:
      - testing-network
  client:
    restart: always
    container_name: sphere-client
    build:
        context: ../../frontend
        dockerfile: ./docker/Dockerfile
        secrets:
          - gh_token
    ports:
      - 5173:5173
    env_file:
      - ../../frontend/.env.production
    networks:
      - testing-network
  nginx:
    restart: always
    container_name: sphere-nginx
    build:
        context: ../../nginx/local
        dockerfile: ./Dockerfile
    ports:
      - 80:80
    depends_on:
      - server
      - client
    networks:
      - testing-network
volumes:
  sphere-mongodb:
    driver: local
  sphere-statics:
    driver: local
  redis_data:
    driver: local
networks:
  testing-network:
    driver: bridge
secrets:
  gh_token:
    file: ../gh_pat.txt
