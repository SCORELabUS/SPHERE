services:
  mongo:
    image: mongo:7.0.16
    ports:
      - '127.0.0.1:27018:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4.2-alpine
    ports:
      - '127.0.0.1:6378:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  mongo-data:
