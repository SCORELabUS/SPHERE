# Per-IP rate limiting, the first barrier against floods. It is generous on
# purpose: a whole classroom may reach SPHERE from a single university address.
# The API also limits each signed-in user on its own (RateLimitMiddleware.ts).
limit_req_zone $binary_remote_addr zone=sphere_api:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=sphere_harvey:10m rate=20r/s;
# Pricing YAML under /static: each request is checked against the version that
# references the file, so it gets its own zone with the API's per-IP rate.
limit_req_zone $binary_remote_addr zone=sphere_static_yaml:10m rate=50r/s;
limit_req_status 429;

server {

    listen 80;
    client_max_body_size 100M;

    large_client_header_buffers 8 64k; # Ajusta según tus necesidades
    client_header_buffer_size 64k;    # Ajusta el tamaño del buffer

    location /api/v1 {
        limit_req           zone=sphere_api burst=100 nodelay;
        include             fastcgi_params;
        proxy_pass          http://server:8080;
        proxy_redirect      off;

        proxy_connect_timeout 500;
        proxy_read_timeout 500;

        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;

    }

    # Pricing YAML files only; avatars, images and other static assets are not
    # limited. A regex location takes precedence over the /static prefix below.
    location ~* ^/static/.+\.ya?ml$ {
        limit_req           zone=sphere_static_yaml burst=200 nodelay;
        include             fastcgi_params;
        proxy_pass          http://server:8080;
        proxy_redirect      off;

        proxy_connect_timeout 500;
        proxy_read_timeout 500;

        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /static/ {
        include             fastcgi_params;
        proxy_pass          http://server:8080;
        proxy_redirect      off;

        proxy_connect_timeout 500;
        proxy_read_timeout 500;

        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;

    }

    location / {
        include             fastcgi_params;
        proxy_pass          http://client:5173;
        proxy_redirect      off;

        proxy_connect_timeout 500;
        proxy_read_timeout 500;

        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;

    }
}
